; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; CHOOSE YOUR MCU: set default_envs to ONE of the environments below.
;   esp32thing_plus   = SparkFun Thing Plus C, ESP32 WROOM (standard KestrelSAT MCU)
;   adalogger_rp2040  = Adafruit Feather RP2040 Adalogger
; The code in src/main.cpp picks the matching camera pins automatically.
; (You can also switch with the "env:" selector in the VS Code status bar.)
; ---------------------------------------------------------------------------
[platformio]
default_envs = esp32thing_plus

; Settings shared by every environment
[env]
framework = arduino
monitor_speed = 115200

[env:esp32thing_plus]
platform = espressif32
; Despite the "s2" in its name, this board ID is the ESP32 WROOM Thing Plus C.
board = sparkfun_esp32s2_thing_plus_c

[env:adalogger_rp2040]
; Earle Philhower's Arduino-Pico core for the RP2040 (downloaded from GitHub
; the first time you build; this can take several minutes).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_adalogger
board_build.core = earlephilhower
; Upload by copying the firmware (.uf2) onto the board's "RPI-RP2" USB drive.
; This needs no extra Windows driver (the default "picotool" upload needs a
; WinUSB driver installed with Zadig on every PC).
upload_protocol = mbed
; Library for the board's RGB status LED (PlatformIO downloads it on first build).
lib_deps = adafruit/Adafruit NeoPixel
